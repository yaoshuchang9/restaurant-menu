<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>扫码点餐 - 舒畅大王</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: #faf7f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        .title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #3d3d3d;
            margin-bottom: 4px;
        }
        .title span { color: #c59a5e; }
        .subtitle {
            color: #999;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .qr-wrapper {
            background: #fff;
            border: 2px solid #e8e0d5;
            border-radius: 16px;
            padding: 16px;
            display: inline-block;
        }
        .qr-wrapper img {
            display: block;
            width: 240px;
            height: 240px;
        }
        .url {
            margin-top: 20px;
            color: #999;
            font-size: 0.8rem;
            word-break: break-all;
        }
        .hint {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #c59a5e;
            font-weight: 500;
        }
        @media print {
            body { background: #fff; padding: 0; }
            .card { box-shadow: none; padding: 32px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">舒畅<span>大王</span></div>
        <p class="subtitle">扫码查看菜单</p>
        <div class="qr-wrapper">
            <img src="qrcode.png" alt="扫码查看菜单">
        </div>
        <div class="url">https://yaoshuchang9.github.io/restaurant-menu/</div>
        <div class="hint">📱 用微信 / 支付宝 / 浏览器扫码</div>
    </div>
</body>
</html>
